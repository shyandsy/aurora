<header class="w-full bg-gray-50 shadow-md border-b border-gray-300">
  <div class="flex items-center justify-end px-6 py-4">
    <div class="flex items-center gap-4">
      <span class="text-sm text-gray-700 font-medium">{{ getCurrentUserEmail() }}</span>

      <!-- Language Switcher -->
      <div class="relative">
        <button type="button"
          class="inline-flex items-center justify-center px-3 py-2 border border-gray-300 shadow-sm text-sm font-medium text-gray-700 bg-white rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
          (click)="showLanguageDropdown.set(!showLanguageDropdown())">
          <span>{{ getLanguageDisplayName(currentLanguage) }}</span>
          <svg class="-mr-1 ml-2 h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
              d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
              clip-rule="evenodd" />
          </svg>
        </button>

        @if (showLanguageDropdown()) {
        <div
          class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-50">
          <div class="py-1" role="menu">
            @for (lang of supportedLanguages; track lang) {
            <button type="button" [class.bg-indigo-50]="lang === currentLanguage"
              class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
              (click)="switchLanguage(lang)" role="menuitem">
              {{ getLanguageDisplayName(lang) }}
              @if (lang === currentLanguage) {
              <span class="ml-2 text-indigo-600">✓</span>
              }
            </button>
            }
          </div>
        </div>
        }
      </div>

      <button (click)="logout()"
        class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 transition-colors">
        {{ 'topbar.logout' | translate }}
      </button>
    </div>
  </div>
</header>
