<!-- 下划线 tab 条:底部通栏细线,选中项 indigo 下划线 + 文字高亮 -->
<div class="border-b border-gray-200 mb-6">
  <nav class="-mb-px flex flex-wrap gap-6" role="tablist">
    @for (tab of tabs(); track tab.id) {
    <button type="button" role="tab" [attr.aria-selected]="activeId() === tab.id" [disabled]="tab.disabled"
      (click)="onSelect(tab)"
      class="inline-flex items-center gap-2 border-b-2 px-1 py-3 text-sm font-medium whitespace-nowrap transition-colors focus:outline-none"
      [class.border-indigo-600]="activeId() === tab.id"
      [class.text-indigo-600]="activeId() === tab.id"
      [class.border-transparent]="activeId() !== tab.id"
      [class.text-gray-500]="activeId() !== tab.id && !tab.disabled"
      [class.hover:text-gray-700]="activeId() !== tab.id && !tab.disabled"
      [class.hover:border-gray-300]="activeId() !== tab.id && !tab.disabled"
      [class.text-gray-300]="tab.disabled"
      [class.cursor-not-allowed]="tab.disabled">
      <span>{{ tab.labelKey ? (tab.labelKey | translate) : tab.label }}</span>
      @if (tab.count != null) {
      <span class="rounded-full px-2 py-0.5 text-xs font-semibold"
        [class.bg-indigo-100]="activeId() === tab.id"
        [class.text-indigo-700]="activeId() === tab.id"
        [class.bg-gray-100]="activeId() !== tab.id"
        [class.text-gray-500]="activeId() !== tab.id">
        {{ tab.count }}
      </span>
      }
    </button>
    }
  </nav>
</div>
