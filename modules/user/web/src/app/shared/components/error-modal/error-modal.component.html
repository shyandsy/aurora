@if (visible) {
<div class="modal-backdrop fixed inset-0 bg-black/30 z-50 flex items-center justify-center"
  (click)="onBackdropClick($event)">
  <div class="modal-content bg-white rounded-lg shadow-xl max-w-md w-full mx-4 p-6" (click)="$event.stopPropagation()">
    <div class="flex items-start justify-between mb-4">
      <h3 class="text-lg font-semibold text-gray-900">错误</h3>
      <button type="button" (click)="onClose()"
        class="text-gray-400 hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 rounded">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    <div class="mb-4">
      <p class="text-sm text-gray-700">{{ message }}</p>
    </div>
    <div class="flex justify-end">
      <button type="button" (click)="onClose()"
        class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
        确定
      </button>
    </div>
  </div>
</div>
}
