<div class="fixed inset-0 bg-black/30 overflow-y-auto h-full w-full z-50" (click)="onCancel()">
  <div class="relative top-10 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white max-h-[90vh] overflow-y-auto"
    (click)="$event.stopPropagation()">
    <div class="mt-3">
      <h3 class="text-lg font-medium text-gray-900 mb-4">{{ formTitle }}</h3>

      <form [formGroup]="roleForm" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
            {{ 'role.name' | translate }}
          </label>
          <input type="text" id="name" formControlName="name"
            class="w-full px-3 py-2 bg-white text-gray-900 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
            [class.border-red-300]="roleForm.get('name')?.invalid && roleForm.get('name')?.touched" />
          @if (roleForm.get('name')?.invalid && roleForm.get('name')?.touched) {
          <p class="mt-1 text-sm text-red-600">{{ getErrorMessage('name') }}</p>
          }
        </div>

        @if (error) {
        <div class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded">
          {{ error }}
        </div>
        }

        <div class="flex justify-end gap-3">
          <button type="button" (click)="onCancel()"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50"
            [disabled]="isSubmitting">
            {{ 'common.cancel' | translate }}
          </button>
          <button type="submit"
            class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700"
            [disabled]="roleForm.invalid || isSubmitting">
            @if (isSubmitting) {
            <span>{{ 'common.saving' | translate }}</span>
            } @else {
            <span>{{ isEditMode ? ('common.update' | translate) : ('common.create' | translate) }}</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
