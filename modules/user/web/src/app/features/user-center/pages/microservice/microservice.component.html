<!-- 页名由上方 tab 栏标注;本页自带子 tab,不再重复巨型 H1;顶部 padding 收紧贴着 tab。 -->
<div class="w-full px-4 pb-8">
  <!-- 当前二级 tab 的创建按钮传送到用户中心壳的 tab 行右侧 -->
  <ng-template tabShellActions>
    @if (activeTab() === 'microservices') {
    <button (click)="onCreateMicroservice()"
      class="px-3.5 py-1.5 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition-colors">
      {{ 'microservice.create' | translate }}
    </button>
    } @else {
    <button (click)="onCreateToken()"
      class="px-3.5 py-1.5 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition-colors">
      {{ 'microservice.token.create' | translate }}
    </button>
    }
  </ng-template>

  <!-- Tabs -->
  <!-- 二级切换:胶囊式(对齐角色页「页面权限/高级」) -->
  <div class="inline-flex rounded-lg border border-gray-300 overflow-hidden text-sm mb-4">
    <button type="button" (click)="switchTab('microservices')"
      [class]="activeTab() === 'microservices' ? 'px-3 py-1.5 bg-indigo-600 text-white' : 'px-3 py-1.5 bg-white text-gray-700 hover:bg-gray-50'">
      {{ 'microservice.microservices' | translate }}
    </button>
    <button type="button" (click)="switchTab('tokens')"
      [class]="activeTab() === 'tokens' ? 'px-3 py-1.5 bg-indigo-600 text-white' : 'px-3 py-1.5 bg-white text-gray-700 hover:bg-gray-50'">
      {{ 'microservice.tokens' | translate }}
    </button>
  </div>

  <!-- Microservices Tab(创建按钮已传送到顶部 tab 行) -->
  @if (activeTab() === 'microservices') {
  <app-microservice-list [refreshTrigger]="refreshMicroserviceTrigger()"
    (editMicroservice)="onEditMicroservice($event)" />
  @if (showCreateEditMicroserviceDialog()) {
  <app-create-edit-microservice [microservice]="editingMicroservice()" (close)="onMicroserviceDialogClose()"
    (saved)="onMicroserviceSaved()" />
  }
  }

  <!-- Tokens Tab(创建按钮已传送到顶部 tab 行) -->
  @if (activeTab() === 'tokens') {
  <app-microservice-token-list [refreshTrigger]="refreshTokenTrigger()" />
  @if (showCreateEditTokenDialog()) {
  <app-create-edit-microservice-token (close)="onTokenDialogClose()" (saved)="onTokenSaved()" />
  }
  }
</div>
