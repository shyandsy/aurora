<!-- 页名由上方 tab 栏(用户/角色/…)标注,本页不再重复巨型 H1;顶部 padding 收紧贴着 tab。 -->
<div class="container mx-auto px-4 pb-8">
  <!-- 创建按钮传送到用户中心壳的 tab 行右侧(本页是「角色」tab) -->
  <ng-template tabShellActions>
    <button (click)="onCreate()"
      class="px-3.5 py-1.5 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition-colors">
      {{ 'role.create' | translate }}
    </button>
  </ng-template>

  <!-- 左角色表 2/5、右权限面板 3/5:权限面板要放下「搜索 + 批量 + 三档分段」,比原来的 1/3 加宽。 -->
  <div class="grid grid-cols-5 gap-6">
    <!-- Left: Role List with Edit/Delete(标题由上方 tab 标注,创建按钮已传送到 tab 行) -->
    <div class="col-span-2">
      <app-role-list [selectedRoleId]="selectedRoleId()" [refreshTrigger]="roleListRefreshTrigger()"
        (roleSelected)="onRoleSelect($event)" (editRole)="onEdit($event)" />
    </div>

    <!-- Right: Permissions (page-level view/operate  |  advanced per-feature) -->
    <div class="col-span-3">
      <div class="mb-4">
        <h2 class="text-xl font-semibold mb-2">{{ 'rolePermission.title' | translate }}</h2>
        <!-- 模式切换:页面权限(推荐) / 高级 -->
        <div class="inline-flex rounded-lg border border-gray-300 overflow-hidden text-sm mb-3">
          <button type="button" (click)="authMode.set('page')"
            [class]="authMode() === 'page' ? 'px-3 py-1.5 bg-indigo-600 text-white' : 'px-3 py-1.5 bg-white text-gray-700 hover:bg-gray-50'">
            {{ 'rolePermission.modePage' | translate }}
          </button>
          <button type="button" (click)="authMode.set('advanced')"
            [class]="authMode() === 'advanced' ? 'px-3 py-1.5 bg-indigo-600 text-white' : 'px-3 py-1.5 bg-white text-gray-700 hover:bg-gray-50'">
            {{ 'rolePermission.modeAdvanced' | translate }}
          </button>
        </div>
      </div>

      @if (authMode() === 'page') {
        <app-page-permission-list [selectedRoleId]="selectedRoleId()" [refreshTrigger]="refreshTrigger()"
          (changed)="onFeatureUpdated()" />
      } @else {
        <app-feature-checkbox-list [selectedRoleId]="selectedRoleId()" [refreshTrigger]="refreshTrigger()" />
      }
    </div>
  </div>

  @if (showCreateEditDialog()) {
  <app-create-edit-role [role]="editingRole()" (close)="onDialogClose()" (saved)="onRoleSaved()" />
  }
</div>
