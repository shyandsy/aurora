<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>登录</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 380px; margin: 24px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .brand { text-align: center; margin-bottom: 24px; }
    .brand h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; color: #f1f5f9; }
    .brand p { font-size: 12px; margin: 0; color: #64748b; }
    label { display: block; font-size: 13px; color: #94a3b8; margin: 16px 0 6px; }
    input {
      width: 100%; padding: 11px 12px; font-size: 14px;
      background: #0f172a; color: #f1f5f9;
      border: 1px solid #334155; border-radius: 8px; outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #6366f1; }
    /* 6 格验证码输入(TOTP)。.otp-box 用类选择器,宽/内边距盖过上面通用 input 规则。 */
    .otp { display: flex; gap: 8px; justify-content: center; }
    .otp-box {
      width: 44px; height: 54px; padding: 0;
      text-align: center; font-size: 22px; font-weight: 600;
    }
    .otp-box:focus { border-color: #6366f1; }
    /* 备用码文本框(切换后显示):居中、字距宽,与 6 格视觉呼应。 */
    .recovery { text-align: center; letter-spacing: .15em; }
    .toggle { margin-top: 14px; text-align: center; }
    .toggle a { color: #818cf8; font-size: 13px; text-decoration: none; cursor: pointer; }
    button {
      width: 100%; margin-top: 22px; padding: 12px;
      font-size: 14px; font-weight: 600;
      background: #6366f1; color: #fff;
      border: 0; border-radius: 8px; cursor: pointer;
      transition: background .15s;
    }
    button:hover:not(:disabled) { background: #4f46e5; }
    button:disabled { opacity: .55; cursor: default; }
    .err {
      margin-top: 16px; padding: 10px 12px;
      background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.35);
      border-radius: 8px; color: #fca5a5; font-size: 13px;
      display: none;
    }
    .err.show { display: block; }
    .hint { margin-top: 18px; text-align: center; font-size: 12px; color: #475569; }
    .loading { text-align: center; color: #94a3b8; font-size: 14px; padding: 12px 0; }
    .step { display: none; }
    .step.show { display: block; }
    .back { margin-top: 14px; text-align: center; }
    .back a { color: #818cf8; font-size: 13px; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>登录</h1>
    </div>

    <!-- 初始:静默续期检查中 -->
    <div id="boot" class="loading">正在检查登录状态…</div>

    <!-- 第一步:账号密码 -->
    <form id="loginStep" class="step" autocomplete="off">
      <label for="email">邮箱</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="loginBtn" type="submit">登录</button>
    </form>

    <!-- 第二步:两步验证码(6 格自动验证;备用码切换成文本框回车提交)-->
    <form id="twoFactorStep" class="step" autocomplete="off">
      <label>两步验证码</label>
      <!-- 6 格 TOTP(默认):输满 6 位自动提交,无按钮 -->
      <div id="otpBoxes" class="otp">
        <input class="otp-box" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="第 1 位">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="第 2 位">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="第 3 位">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="第 4 位">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="第 5 位">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="第 6 位">
      </div>
      <!-- 备用码(切换后显示):变长,回车提交 -->
      <input id="recoveryCode" class="recovery" type="text" autocomplete="one-time-code"
             placeholder="输入备用码后回车" style="display:none">
      <div class="toggle"><a id="toggleRecovery">用备用码</a></div>
      <div class="back"><a id="backToLogin">← 返回</a></div>
    </form>

    <div id="err" class="err"></div>
    <div class="hint">受两步验证保护</div>
  </div>

  <script>
    (function () {
      'use strict';
      var API = '/api/user/v1';
      var K = {
        access: 'admin_access_token',
        refresh: 'admin_refresh_token',
        user: 'admin_user',
        enroll: 'admin_2fa_enrollment_pending'
      };

      var elBoot = document.getElementById('boot');
      var elLogin = document.getElementById('loginStep');
      var elTwoFactor = document.getElementById('twoFactorStep');
      var elErr = document.getElementById('err');
      var pendingToken = '';

      function showErr(msg) { elErr.textContent = msg; elErr.classList.add('show'); }
      function clearErr() { elErr.classList.remove('show'); }

      function show(el) {
        elBoot.style.display = 'none';
        elLogin.classList.remove('show');
        elTwoFactor.classList.remove('show');
        el.classList.add('show');
      }

      function setGateCookie(token) {
        document.cookie = 'admin_gate=' + token + '; Path=/; SameSite=Strict; Secure';
      }
      function clearTokens() {
        localStorage.removeItem(K.access);
        localStorage.removeItem(K.refresh);
        localStorage.removeItem(K.user);
        localStorage.removeItem(K.enroll);
        document.cookie = 'admin_gate=; Path=/; Max-Age=0; SameSite=Strict; Secure';
      }

      function persistLogin(data) {
        if (data.accessToken) localStorage.setItem(K.access, data.accessToken);
        if (data.refreshToken) localStorage.setItem(K.refresh, data.refreshToken);
        var user = data.user || { features: data.features || [] };
        localStorage.setItem(K.user, JSON.stringify(user));
        if (data.mustEnrollTwoFactor) localStorage.setItem(K.enroll, '1');
        else localStorage.removeItem(K.enroll);
        setGateCookie(data.accessToken);
      }

      // 续期/登录成功后跳回用户原本要去的页(门禁 302 带来的 ?returnUrl=),没有或不安全则落首页。
      // 三重锁死防开放重定向:①正则只允许站内路径的安全字符集(反斜杠/空白/控制符/绝对URL全拒);
      // ②排除 /gate、/login 自身防死循环;③用 new URL 解析确认**解析出来还是本站 origin**(挡住
      // /\evil.com、%5C 等浏览器归一化把 \ 当 / 的绕过)。判"解析后是不是自己域",不判表面字符。
      var RETURN_URL_RE = /^\/(?!\/)[A-Za-z0-9\-._~/?#=&@%+:,]*$/;
      function safeReturnUrl() {
        try {
          var p = new URLSearchParams(window.location.search).get('returnUrl') || '';
          if (!RETURN_URL_RE.test(p)) return '/';
          if (p.indexOf('/gate') === 0 || p.indexOf('/login') === 0) return '/';
          var u = new URL(p, window.location.origin);
          if (u.origin !== window.location.origin) return '/';
          return u.pathname + u.search + u.hash;
        } catch (e) { return '/'; }
      }
      function enterApp() { window.location.replace(safeReturnUrl()); }

      function postJSON(path, body) {
        return fetch(API + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      }

      function trySilentRefresh() {
        var rt = localStorage.getItem(K.refresh);
        if (!rt) return Promise.resolve(false);
        return postJSON('/auth/refresh', { refreshToken: rt })
          .then(function (res) { return res.ok ? res.json() : null; })
          .then(function (data) {
            if (!data || !data.accessToken) return false;
            localStorage.setItem(K.access, data.accessToken);
            if (data.refreshToken) localStorage.setItem(K.refresh, data.refreshToken);
            setGateCookie(data.accessToken); // user 已在本地,续期响应不含 user,保留即可
            return true;
          })
          .catch(function () { return false; });
      }

      function setBusy(btn, busy, label) {
        btn.disabled = busy;
        btn.textContent = busy ? '请稍候…' : label;
      }

      // ---- 第一步:账号密码 ----
      elLogin.addEventListener('submit', function (e) {
        e.preventDefault();
        clearErr();
        var btn = document.getElementById('loginBtn');
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        setBusy(btn, true, '登录');
        postJSON('/auth/login', { email: email, password: password })
          .then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (data) {
              return { ok: res.ok, data: data };
            });
          })
          .then(function (r) {
            if (!r.ok) { showErr(r.data.message || '登录失败'); setBusy(btn, false, '登录'); return; }
            if (r.data.twoFactorRequired) {
              pendingToken = r.data.pendingToken || '';
              setBusy(btn, false, '登录');
              show(elTwoFactor);
              focusOtp(0);
              return;
            }
            persistLogin(r.data);
            enterApp();
          })
          .catch(function () { showErr('网络错误,请重试'); setBusy(btn, false, '登录'); });
      });

      // ---- 第二步:两步验证 ----
      // 默认 6 格 TOTP:每格 1 位数字,输入自动跳下一格、退格回上一格、← →切格、粘贴整串自动分配,
      // 输满 6 位自动提交(无按钮)。「用备用码」切换成单个文本框(变长,回车提交)。
      var verifying = false;
      var recoveryMode = false;
      var elOtpBoxes = document.getElementById('otpBoxes');
      var boxes = Array.prototype.slice.call(elOtpBoxes.querySelectorAll('.otp-box'));
      var elRecovery = document.getElementById('recoveryCode');
      var elToggleRecovery = document.getElementById('toggleRecovery');

      function otpValue() { return boxes.map(function (b) { return b.value; }).join(''); }
      function clearOtp() { boxes.forEach(function (b) { b.value = ''; }); }
      function focusOtp(i) {
        var el = boxes[Math.max(0, Math.min(i, boxes.length - 1))];
        if (el) { el.focus(); el.select(); }
      }
      function setInputsDisabled(d) {
        boxes.forEach(function (b) { b.disabled = d; });
        elRecovery.disabled = d;
      }

      function submitCode(code) {
        if (verifying) return;
        code = (code || '').trim();
        if (!code) return;
        verifying = true;
        clearErr();
        setInputsDisabled(true);
        postJSON('/auth/login/2fa', { pendingToken: pendingToken, code: code })
          .then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (data) {
              return { ok: res.ok, data: data };
            });
          })
          .then(function (r) {
            if (!r.ok) {
              showErr(r.data.message || '验证码错误');
              verifying = false; setInputsDisabled(false);
              if (recoveryMode) { elRecovery.value = ''; elRecovery.focus(); }
              else { clearOtp(); focusOtp(0); }
              return;
            }
            persistLogin(r.data);
            enterApp();
          })
          .catch(function () {
            showErr('网络错误,请重试');
            verifying = false; setInputsDisabled(false);
            (recoveryMode ? elRecovery : boxes[0]).focus();
          });
      }

      // 每格:只留最后一个数字,自动跳格;输满 6 位自动提交。
      boxes.forEach(function (box, i) {
        box.addEventListener('input', function () {
          var ch = box.value.replace(/\D/g, '').slice(-1);
          box.value = ch;
          if (ch && i < boxes.length - 1) focusOtp(i + 1);
          var v = otpValue();
          if (/^\d{6}$/.test(v)) submitCode(v);
        });
        box.addEventListener('keydown', function (e) {
          if (e.key === 'Backspace') {
            if (box.value) { box.value = ''; }
            else if (i > 0) { focusOtp(i - 1); boxes[i - 1].value = ''; }
            e.preventDefault();
          } else if (e.key === 'ArrowLeft' && i > 0) { focusOtp(i - 1); e.preventDefault(); }
          else if (e.key === 'ArrowRight' && i < boxes.length - 1) { focusOtp(i + 1); e.preventDefault(); }
        });
        box.addEventListener('focus', function () { box.select(); });
      });
      // 粘贴整串:抽出数字分配到各格,输满自动提交。
      elOtpBoxes.addEventListener('paste', function (e) {
        var cb = e.clipboardData || window.clipboardData;
        var text = ((cb && cb.getData('text')) || '').replace(/\D/g, '').slice(0, boxes.length);
        if (!text) return;
        e.preventDefault();
        clearOtp();
        for (var j = 0; j < text.length; j++) boxes[j].value = text[j];
        focusOtp(text.length);
        if (/^\d{6}$/.test(otpValue())) submitCode(otpValue());
      });
      // 备用码文本框:回车提交(变长)。
      elRecovery.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); submitCode(elRecovery.value); }
      });
      // 表单回车兜底:按当前模式取值提交。
      elTwoFactor.addEventListener('submit', function (e) {
        e.preventDefault();
        submitCode(recoveryMode ? elRecovery.value : otpValue());
      });

      // 「用备用码 / 用验证器」切换。
      elToggleRecovery.addEventListener('click', function () {
        recoveryMode = !recoveryMode;
        clearErr();
        elRecovery.value = '';
        clearOtp();
        if (recoveryMode) {
          elOtpBoxes.style.display = 'none';
          elRecovery.style.display = '';
          elToggleRecovery.textContent = '用验证器';
          elRecovery.focus();
        } else {
          elRecovery.style.display = 'none';
          elOtpBoxes.style.display = '';
          elToggleRecovery.textContent = '用备用码';
          focusOtp(0);
        }
      });

      document.getElementById('backToLogin').addEventListener('click', function () {
        clearErr();
        pendingToken = '';
        clearOtp();
        elRecovery.value = '';
        show(elLogin);
        document.getElementById('email').focus();
      });

      // ---- 加载:先试静默续期,失败再显示登录 ----
      trySilentRefresh().then(function (ok) {
        if (ok) { enterApp(); return; }
        clearTokens();
        show(elLogin);
        document.getElementById('email').focus();
      });
    })();
  </script>
</body>
</html>
