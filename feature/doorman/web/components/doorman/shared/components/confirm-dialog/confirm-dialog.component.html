@if (visible) {
<div class="fixed inset-0 bg-black/30 overflow-y-auto h-full w-full z-50 flex items-center justify-center p-4"
  (click)="onBackdropClick($event)">
  <div class="relative bg-white rounded-lg shadow-xl max-w-md w-full" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-200">
      <h3 class="text-lg font-semibold text-gray-900">
        {{ title }}
      </h3>
    </div>

    <!-- Content -->
    <div class="px-6 py-4">
      <p class="text-sm text-gray-700">
        {{ message }}
      </p>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
      <button type="button" (click)="onCancel()"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
        {{ cancelText }}
      </button>
      <button type="button" (click)="onConfirm()"
        [class]="'px-4 py-2 text-sm font-medium text-white rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 ' + confirmButtonClass">
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
}
