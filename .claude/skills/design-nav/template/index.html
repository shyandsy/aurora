<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>项目名 · 设计导航</title>
<!-- design-nav 壳模板(全项目统一)· 完整 standalone HTML,进仓库后双击 / 静态托管即渲染。
     ★ 要改的只有:① 上面 <title> 的「项目名」② 下面 PROJECT 常量 ③ ENDS 数据数组。其余 CSS/JS 别动。
     铁律:第一个端必为「规范」;顶层只放端、子菜单做缩进子组;照真实 sidebar 列全、待补 src:null。
     定位:tab→子页内 pick(id);screen→.screen 里 .nav 含关键词;src=null→待补。设计稿放 d/,iframe 子页。
     (若另把它发布成 claude artifact 当预览:那条路 harness 注入 head、要求文件不带 <head>;源头=仓库这份保留本 head。)-->
<style>
  :root{
    --bg:#eef0f3; --panel:#ffffff; --border:#e3e6ec;
    --text:#1f2430; --dim:#6b7280; --faint:#9aa1ae; --accent:#4f46e5;
    --rail:#0f1522; --rail-top:#0b0f1a; --rail-text:#d4d9e4;
    --rail-dim:#79828f; --rail-sub:#8b94a6; --rail-hover:#19202f;
    --rail-active-bg:#4f46e5; --rail-border:#1d2535;
    --todo:#b2824a; --have:#3fae7a;
  }
  /* 暗色:平铺写法(@media 在外、选择器在内)——平台规范,躲开缩略图渲染器/老 webview 不支持 CSS 嵌套 */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a0d13; --panel:#121824; --border:#232c3b;
      --text:#e6e9ef; --dim:#8b94a6; --faint:#5f6878; --accent:#8b86f8; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0d13; --panel:#121824; --border:#232c3b;
    --text:#e6e9ef; --dim:#8b94a6; --faint:#5f6878; --accent:#8b86f8; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.45 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;overflow:hidden}
  .rail{width:272px;flex:0 0 auto;height:100%;background:var(--rail);
    border-right:1px solid var(--rail-border);display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px)}
  .rail-head{padding:15px 18px 13px;border-bottom:1px solid var(--rail-border);background:var(--rail-top)}
  .brand{display:flex;align-items:center;gap:9px;color:#fff;font-size:15px;font-weight:650}
  .brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#6366f1,#4f46e5);
    display:grid;place-items:center;font-size:12px;box-shadow:0 2px 6px rgba(79,70,229,.45)}
  .brand-sub{margin-top:5px;color:var(--rail-dim);font-size:11px}
  .brand-sub b{color:var(--have);font-weight:600}
  .nav{flex:1 1 auto;overflow-y:auto;padding:6px 10px 28px;scrollbar-width:thin}
  .end{margin-top:16px}
  .end:first-child{margin-top:6px}
  .end-h{display:flex;align-items:center;gap:8px;color:#fff;font-size:12.5px;font-weight:700;padding:7px 10px}
  .end-h .gi{font-size:14px}
  .sub-h{display:flex;align-items:center;gap:6px;color:var(--rail-sub);font-size:10.5px;font-weight:700;
    letter-spacing:.09em;text-transform:uppercase;padding:8px 10px 4px 22px}
  .sub-h .gi{font-size:11px;letter-spacing:0}
  .page{display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;border:0;
    background:transparent;color:var(--rail-text);font-size:13.5px;font-weight:520;
    padding:7px 11px 7px 24px;border-radius:8px;position:relative;line-height:1.25}
  .page.nested{padding-left:36px}
  .page::before{content:"";position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:5px;height:5px;border-radius:50%;background:var(--have)}
  .page.nested::before{left:25px}
  .page.todo{color:var(--rail-dim);font-weight:460}
  .page.todo::before{background:var(--rail-border)}
  .page:hover{background:var(--rail-hover)}
  .page.on{background:var(--rail-active-bg);color:#fff;font-weight:600}
  .page.on::before{background:#fff}
  .page .tag{margin-left:auto;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;
    background:rgba(255,255,255,.07);color:var(--rail-dim)}
  .page .tag.todo{color:var(--todo);background:rgba(178,130,74,.14)}
  .page.on .tag{background:rgba(255,255,255,.2);color:#fff}
  .main{flex:1 1 auto;min-width:0;height:100%;display:flex;flex-direction:column}
  .top{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 16px;height:52px;
    background:var(--panel);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
  .crumb{min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .crumb .b1{color:var(--dim);font-size:12.5px}
  .crumb .sep{color:var(--faint)}
  .crumb .b2{color:var(--text);font-size:15px;font-weight:650}
  .top .spacer{flex:1 1 auto}
  .tbtn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--border);
    background:var(--panel);color:var(--dim);font-size:12.5px;font-weight:600;padding:6px 11px;
    border-radius:8px;text-decoration:none}
  .tbtn:hover{color:var(--text);border-color:var(--accent)}
  .hamb{display:none;cursor:pointer;border:1px solid var(--border);background:var(--panel);
    color:var(--text);border-radius:8px;width:34px;height:34px;font-size:16px}
  .stage{flex:1 1 auto;min-height:0;position:relative;background:var(--bg)}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--panel)}
  .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;color:var(--faint);font-size:13.5px;text-align:center;padding:24px}
  .empty .big{font-size:30px;opacity:.5}
  .scrim{display:none}
  @media (max-width:760px){
    .rail{position:fixed;z-index:30;left:0;top:0;bottom:0;transform:translateX(-100%);
      transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.4)}
    body.navopen .rail{transform:none}
    .scrim{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);opacity:0;
      pointer-events:none;transition:opacity .22s}
    body.navopen .scrim{opacity:1;pointer-events:auto}
    .hamb{display:inline-grid;place-items:center}
  }
  @media (prefers-reduced-motion:reduce){.rail,.scrim{transition:none}}
</style>
</head>
<body>

<aside class="rail" id="rail">
  <div class="rail-head">
    <div class="brand"><span class="dot">▦</span><span>设计导航</span></div>
    <div class="brand-sub" id="brandSub">项目名 · 页面设计稿</div>
  </div>
  <nav class="nav" id="nav"></nav>
</aside>
<div class="scrim" id="scrim"></div>
<main class="main">
  <header class="top">
    <button class="hamb" id="hamb" aria-label="菜单">☰</button>
    <div class="crumb"><span class="b1" id="cGroup">—</span><span class="sep">/</span>
      <span class="b2" id="cPage">选择左侧一个页面</span></div>
    <div class="spacer"></div>
    <a class="tbtn" id="openNew" target="_blank" rel="noopener" hidden>↗ 新标签打开</a>
  </header>
  <div class="stage">
    <div class="empty" id="empty"><div class="big">▦</div><div id="emptyMsg">← 从左侧选择一个页面</div></div>
    <iframe id="frame" title="设计稿" hidden></iframe>
  </div>
</main>

<script>
/* ===== ① 项目名(驱动左上品牌 + 浏览器标题;gallery 名另见顶部 <title>,也要把「项目名」换掉)===== */
const PROJECT="项目名";

/* ===== ② 只改这个 ENDS 数组(照本项目真实 sidebar/routes 填);别动下面的逻辑 =====
   顶层 = 端;端内可有缩进子组 {sub,icon,items}(如"监控大盘");待补页 src:null。
   第一个端必须是「规范」(铁律1)。 */
const ENDS=[
  { end:"规范", icon:"📐", items:[                 // 铁律1:必须排第一,唯一真源
    { k:"spec", label:"设计规范 · Tokens", src:"d/spec.html" },
  ]},
  { end:"移动端 App", icon:"📱", items:[            // 若无移动端可删掉整个端
    { k:"m-home", label:"示例页", src:"d/mobile.html", screen:"关键词" },
    // …照移动端真实页列全,待补的 src:null…
  ]},
  { end:"Web 控制台", icon:"🖥", items:[            // 照 sidebar.component.ts 的 buildMenu() 列全
    { k:"home", label:"首页", src:null },
    { sub:"监控大盘", icon:"📊", items:[             // sidebar 里可展开的子菜单 → 做成缩进子组
      { k:"mon-a", label:"子页A", src:null },
    ]},
    { k:"page-b", label:"页B(tab式设计)", src:"d/deploy-ux.html", tab:"b" },
    { k:"page-c", label:"页C(待补)", src:null },
  ]},
];

const flat={}; let haveN=0,totalN=0;
function reg(p,end){p._end=end;flat[p.k]=p;totalN++;if(p.src)haveN++;}
ENDS.forEach(g=>g.items.forEach(it=>{ if(it.sub) it.items.forEach(p=>reg(p,g.end)); else reg(it,g.end); }));
const navEl=document.getElementById("nav"),frame=document.getElementById("frame");
const empty=document.getElementById("empty"),emptyMsg=document.getElementById("emptyMsg");
const cGroup=document.getElementById("cGroup"),cPage=document.getElementById("cPage"),openNew=document.getElementById("openNew");
document.querySelector(".brand span:last-child").textContent=PROJECT+" · 设计导航";
try{document.title=PROJECT+" · 设计导航";}catch(e){}
document.getElementById("brandSub").innerHTML=`<b>${haveN}</b>/${totalN} 页有稿`;
let currentSrc=null;
function pageBtn(p,nested){
  const b=document.createElement("button");
  b.className="page"+(nested?" nested":"")+(p.src?"":" todo");b.dataset.k=p.k;
  const tag=p.tag?`<span class="tag">${p.tag}</span>`:(p.src?"":`<span class="tag todo">待补</span>`);
  b.innerHTML=`<span>${p.label}</span>${tag}`;b.onclick=()=>select(p.k,true);return b;
}
ENDS.forEach(g=>{
  const gw=document.createElement("div");gw.className="end";
  const gh=document.createElement("div");gh.className="end-h";
  gh.innerHTML=`<span class="gi">${g.icon}</span><span>${g.end}</span>`;gw.appendChild(gh);
  g.items.forEach(it=>{
    if(it.sub){
      const sh=document.createElement("div");sh.className="sub-h";
      sh.innerHTML=`<span class="gi">${it.icon||"▸"}</span><span>${it.sub}</span>`;gw.appendChild(sh);
      it.items.forEach(p=>gw.appendChild(pageBtn(p,true)));
    }else gw.appendChild(pageBtn(it,false));
  });
  navEl.appendChild(gw);
});
function closeNav(){document.body.classList.remove("navopen");}
function select(k,userClicked){
  const p=flat[k];if(!p)return;
  cGroup.textContent=p._end;cPage.textContent=p.label;
  document.querySelectorAll(".page").forEach(e=>e.classList.toggle("on",e.dataset.k===k));
  try{location.hash=k;}catch(e){}
  if(userClicked)closeNav();
  if(!p.src){frame.hidden=true;empty.hidden=false;openNew.hidden=true;currentSrc=null;
    emptyMsg.textContent=`「${p.label}」暂无设计稿 · 待补`;return;}
  empty.hidden=true;frame.hidden=false;openNew.hidden=false;openNew.href=p.src;
  if(p.src!==currentSrc){currentSrc=p.src;frame.onload=()=>position(p);frame.src=p.src;}else position(p);
}
function position(p){
  try{
    if(p.tab){const w=frame.contentWindow;if(w&&typeof w.pick==="function")w.pick(p.tab);
      const sc=frame.contentDocument&&frame.contentDocument.scrollingElement;if(sc)sc.scrollTop=0;}
    else if(p.screen){const doc=frame.contentDocument,screens=[...doc.querySelectorAll(".screen")];
      const hit=screens.find(el=>{const n=el.querySelector(".nav");return n&&n.textContent.includes(p.screen);});
      (hit||screens[0]||doc.body).scrollIntoView({behavior:"smooth",block:"start"});}
    else{const sc=frame.contentDocument&&frame.contentDocument.scrollingElement;if(sc)sc.scrollTo({top:0});}
  }catch(e){}
}
// 首屏非空(artifact-design「show page at rest」):hash 命中则选它,否则默认选第一个有稿页。
(function init(){const k=(location.hash||"").replace(/^#/,"");
  if(flat[k]){select(k,false);return;}
  const first=Object.keys(flat).find(x=>flat[x].src); if(first)select(first,false);})();
document.getElementById("hamb").onclick=()=>document.body.classList.toggle("navopen");
document.getElementById("scrim").onclick=closeNav;
</script>
</body>
</html>
